name: aneesh2
region: nyc1

services:
  - name: namaste-do-web
    # Use Docker Hub image (public repository)
    image:
      registry_type: DOCKER_HUB
      registry: suvrat1629
      repository: namaste-web
      tag: latest
    routes:
      - path: /
      
    
    instance_count: 1
    instance_size_slug: basic-xxs
    
    http_port: 8082
    
    # health_check:
    #   http_path: /actuator/health
    #   initial_delay_seconds: 60
    #   period_seconds: 30
    #   timeout_seconds: 5
    #   success_threshold: 1
    #   failure_threshold: 3
    
    envs:
      # Database Configuration
      - key: SPRING_DATA_MONGODB_URI
        scope: RUN_TIME
        type: SECRET
        value: PLACEHOLDER_MONGODB_URI
      
      # JWT Configuration
      - key: JWT_SECRET
        scope: RUN_TIME
        type: SECRET
        value: PLACEHOLDER_JWT_SECRET

      - key: JWT_EXPIRATION_MS
        scope: RUN_TIME
        value: "86400000"

      # FHIR Configuration
      - key: FHIR_TERMINOLOGY_VERSION
        scope: RUN_TIME
        value: "1.0.0"
      
      - key: FHIR_CODESYSTEM_COUNT
        scope: RUN_TIME
        value: "4500"

      # Logging Configuration
      - key: LOGGING_LEVEL_COM_NAMASTE_NAMASTE_TO_TM2
        scope: RUN_TIME
        value: DEBUG

      - key: LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_SECURITY
        scope: RUN_TIME
        value: DEBUG
      
      # Server Configuration
      - key: SERVER_PORT
        scope: RUN_TIME
        value: "8082"

# Optional: Add a database if needed
# databases:
#   - name: traditional-medicine-db
#     engine: MONGODB
#     version: "5"
